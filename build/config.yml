# 本文件是项目构建配置。
# 修改 `info` 或 `fileAssociations` 后，需执行 `wails3 task common:update:build-assets` 同步资源。
# 注意：该任务会覆盖你对手工生成资源的改动。
version: '3'

# 以下信息用于生成各平台构建资源。
info:
  companyName: 'Rouarn'
  productName: 'Wails3Template'
  productIdentifier: 'com.rouarn.wails3template'
  description: '基于 Wails v3 与 Vite Plus 的桌面应用模板'
  copyright: '(c) 2026, Rouarn'
  comments: 'Wails v3 桌面应用模板'
  version: '0.1.0'
  # cfBundleIconName: "appicon" # macOS 在 Assets.car 图标包中使用的图标名（可选）
  #                               # 应与 .icon 文件名去掉扩展名后一致
  #                               # 未设置且存在 Assets.car 时，默认取 "appicon"

# 开发模式配置
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - packages/frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.js' # 监听通过 //wails:include 指令引入的 JS/TS 文件变更。
      - '*.ts' # 前端目录已被上面的 ignore 配置整体排除。
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # 标准前端任务会等待 FRONTEND_DEVSERVER_URL 返回 HTTP 200，最长 60s，
      # 然后再启动应用。如需要可覆盖；自定义后台命令也可以复用同样的 readiness 配置。
      # readiness:
      #   http: "http://localhost:5173/"
      #   timeout: "60s"
      #   interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# 文件关联
# 详见 https://v3.wails.io/noit/done/yet
fileAssociations:
#  - ext: wails
#    name: Wails
#    description: Wails 应用文件
#    iconName: wailsFileIcon
#    role: Editor
#  - ext: jpg
#    name: JPEG
#    description: 图片文件
#    iconName: jpegFileIcon
#    role: Editor
#    mimeType: image/jpeg  # （可选）

# 其他自定义数据
other:
  - name: My Other Data
