version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # 交叉编译所用的 Docker 镜像（在非 macOS 主机上构建时启用）
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: 构建应用
    cmds:
      # 实验性的无 CGO 后端（-tags purego 或 WAILS_PUREGO=1）不需要 C 工具链，
      # 因此可在任意主机本地编译；启用 cgo 时则通过 Docker 交叉编译。
      - task: '{{if or (eq OS "darwin") (has "purego" (splitList "," (.EXTRA_TAGS | default "")))}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: 本地构建应用（macOS，或任意带 -tags purego 的主机）
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: '混淆构建需要 garble。安装命令：go install mvdan.cc/garble@v0.16.0（要求 Go 1.24+）。版本与工具链兼容性见 https://github.com/burrowers/garble/releases。'
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: '{{if (has "purego" (splitList "," (.EXTRA_TAGS | default "")))}}0{{else}}1{{end}}'
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'

  build:docker:
    summary: 使用 Docker 交叉编译 macOS 产物（用于 Linux/Windows 主机）
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: '交叉编译需要 Docker，请先安装 Docker。'
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          未找到 Docker 镜像 '{{.CROSS_IMAGE}}'。
          请先执行：wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # 生成 Docker 卷挂载：Go 模块缓存 + go.mod 中的 replace 指令
      # 通过 wails3 tool docker-mounts 生成，兼容 Windows/Linux/macOS
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: 构建 macOS 通用二进制（arm64 + amd64）
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64'
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64'
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: 使用原生 lipo 生成通用二进制（macOS）
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: 使用 wails3 tool lipo 生成通用二进制（Linux/Windows）
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: 把应用打包成 `.app` 应用包
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: 打包 macOS 通用二进制（arm64 + amd64）
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  package:dmg:
    summary: 把应用打包成带样式的 `.dmg` 安装包
    deps:
      - task: package
    cmds:
      - task: create:dmg

  create:dmg:
    summary: 基于 `.app` 应用包生成可配置的 `.dmg`
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_NAME}}" --out "{{.BIN_DIR}}"
        --background "{{.DMG_BACKGROUND}}"
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        --file-icon "{{.DMG_FILE_ICON}}"
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default "build/darwin/dmg-background.png"}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default "build/darwin/dmg-file-icon.icns"}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'

  create:app:bundle:
    summary: 生成 `.app` 应用包
    cmds:
      # 复用的应用包可能在同步目录里被 Finder 写入元数据。这里每次重建，
      # 避免 codesign 需要覆盖已被污染的签名。
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  codesign:adhoc:
    summary: 对应用包做 ad-hoc 签名（仅 macOS）
    internal: true
    cmds:
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  codesign:skip:
    summary: 交叉编译时跳过签名
    internal: true
    cmds:
      - 'echo "已跳过 codesign（当前平台 {{OS}} 不可用）。分发前请在 macOS 上对 .app 签名。"'

  run:
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: 使用 Developer ID 签名应用包
    desc: |
      为分发签名 .app 应用包。
      签名身份取自 `wails3 setup`（保存在 ~/.config/wails/defaults.yaml）。
      可通过以下方式覆盖：task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: 签名并公证应用包
    desc: |
      签名 .app 应用包并提交公证。
      签名身份与钥匙串配置取自 `wails3 setup`。

      首次配置：
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --notarize {{.CLI_ARGS}}
