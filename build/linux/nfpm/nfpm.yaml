# 如不需要以下配置可自行删除。
# 文档见 https://nfpm.goreleaser.com
#
# 下面几行是 Vim 的 `modelines`，见 `:help modeline`

name: "Wails3Template"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "基于 Wails v3 与 Vite Plus 的桌面应用模板"
vendor: "Rouarn"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/Wails3Template"
    dst: "/usr/local/bin/Wails3Template"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/Wails3Template.png"
  - src: "./build/linux/Wails3Template.desktop"
    dst: "/usr/share/applications/Wails3Template.desktop"

# GTK4 + WebKitGTK 6.0 的默认依赖（Ubuntu 24.04+ / Debian 13+）
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# 按发行版覆盖不同包格式的配置
overrides:
  # Fedora / RHEL / AlmaLinux / Rocky Linux 的 RPM 包
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux 包
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts 段用于安装后刷新 desktop 数据库
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # 如需要也可补充 preremove、postremove
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# 若使用 -tags gtk3 构建（旧版 WebKit2GTK 4.1 栈，v3.0.x 可用，v3.1 已移除），
# 请把上面的 depends/overrides 替换为：
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
