version: '3'

vars:
  APP_NAME: 'Wails3Template'
  BIN_DIR: 'bin'
  # 前端由 pnpm workspace 管理，构建入口固定为 pnpm（逻辑在 frontend/package.json）。
  PACKAGE_MANAGER: 'pnpm'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  cli:check:
    summary: 校验 Wails3 CLI 版本（>= v3.1.0，支持 WAILS3_BIN）
    internal: true
    cmds:
      - node scripts/wails.mjs check

  build:
    summary: 构建当前平台的可执行文件
    deps:
      - task: cli:check
    cmds:
      - task: '{{.GOOS}}:build'

  package:
    summary: 打包当前平台的安装产物
    deps:
      - task: cli:check
    cmds:
      - task: '{{.GOOS}}:package'

  run:
    summary: 运行已构建的程序
    cmds:
      - task: '{{.GOOS}}:run'

  dev:
    summary: 开发模式（热重载），自动挑选端口并校验 CLI 版本
    cmds:
      - node scripts/dev.mjs
