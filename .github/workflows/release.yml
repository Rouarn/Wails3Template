name: Release

# 重活：只在发布时打包三平台产物。
# - push tag v*.*.*：三平台打包，产物上传 artifact，并作为 Release 附件。
# - workflow_dispatch：可只打包指定平台，产物只上传 artifact，不发 Release。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platform:
        description: 打包平台
        required: true
        type: choice
        default: all
        options: [all, darwin, windows, linux]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: 选择打包目标
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: 计算目标平台
        id: pick
        shell: bash
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}" in
            all)
              targets='[{"os":"macos-latest","platform":"darwin","task":"darwin:package"},{"os":"windows-latest","platform":"windows","task":"windows:package"},{"os":"ubuntu-24.04","platform":"linux","task":"linux:package"}]'
              ;;
            darwin)
              targets='[{"os":"macos-latest","platform":"darwin","task":"darwin:package"}]'
              ;;
            windows)
              targets='[{"os":"windows-latest","platform":"windows","task":"windows:package"}]'
              ;;
            linux)
              targets='[{"os":"ubuntu-24.04","platform":"linux","task":"linux:package"}]'
              ;;
            *)
              echo "未知平台：${{ inputs.platform }}" >&2
              exit 1
              ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  package:
    name: 打包（${{ matrix.platform }}）
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 NSIS（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: 安装 Wails CLI 与 Task
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          go install github.com/go-task/task/v3/cmd/task@v3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 打包
        run: wails3 task ${{ matrix.task }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: bin/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布附件
    needs: [plan, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 附加到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
