name: CI

# 提交阶段：只跑检查与构建，不产出任何安装包。
# 打包（darwin/windows/linux package）在 .github/workflows/release.yml，
# 由 tag 推送或手动 workflow_dispatch 触发。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与构建（ubuntu-24.04）
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Wails CLI 与 Task
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          go install github.com/go-task/task/v3/cmd/task@v3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装 golangci-lint
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 拆成两个 step：多行 run 不会因中间命令非零而中断，
      # 合并写法会让 check:bindings 的失败被 git diff 的退出码覆盖（假绿）。
      - name: 契约漂移检测（重新生成）
        run: pnpm check:bindings

      - name: 契约漂移检测（确认无差异）
        run: git diff --exit-code -- frontend/bindings

      - name: 前端门禁
        run: pnpm check:fe

      - name: Go 门禁
        run: pnpm check:go

      # 只证明「前端产物 + 当前平台二进制能编译」，不执行 *:package。
      - name: 构建（不打包）
        run: pnpm build
